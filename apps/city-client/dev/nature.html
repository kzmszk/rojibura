<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>rojibura nature</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				overflow: hidden;
				background: #bcd;
				font: 13px system-ui, sans-serif;
			}
			#app {
				position: fixed;
				inset: 0;
			}
			#ui {
				position: fixed;
				left: 10px;
				top: 10px;
				display: flex;
				gap: 6px;
				flex-wrap: wrap;
				max-width: 70vw;
			}
			#ui button {
				border: 0;
				border-radius: 6px;
				padding: 6px 10px;
				background: #fffd;
				cursor: pointer;
			}
			#stats {
				position: fixed;
				right: 10px;
				top: 10px;
				background: #0008;
				color: #fff;
				padding: 6px 8px;
				border-radius: 6px;
				white-space: pre;
				font: 12px ui-monospace, monospace;
			}
			body.shot #ui,
			body.shot #stats {
				display: none;
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<div id="ui"></div>
		<div id="stats"></div>
		<script type="module" src="./nature.ts"></script>
	</body>
</html>
